<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>сайтик</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <h1>Работа с api</h1>
    <nav class="main-nav" aria-label="Основная навигация">
      <a href="#users">Пользователи</a>
      <a href="#btc">Курс BTC</a>
      <a href="#ipify">Мой IP</a>
    </nav>
  </div>
</header>

<main class="container main-content">

  <section id="btc" class="panel">
    <h2>CoinGecko</h2>
    <button id="load-btc" class="button button-primary">Загрузить курс</button>
    <div id="btc-state" class="state-box">Курс ещё не загружен.</div>
    <div id="btc-result" class="result-box"></div>
  </section>

  <section id="users" class="panel">
  <h2>dummyjson GET POST PATCH DELETE</h2>
  <div class="crud-forms">

    <!-- GET -->
    <form id="load-users-form">
      <button type="button" class="button button-primary">GET пользователи</button>
    </form>

    <!-- Обновление списка -->
    <button id="refresh-users" class="button button-success">Обновить список</button>

    <!-- POST -->
    <form id="create-user-form">
      <input id="new-user-name" name="firstName" type="text" placeholder="Имя" required>
      <input id="new-user-lastname" name="lastName" type="text" placeholder="Фамилия" required>
      <button type="submit" class="button button-success">POST создать</button>
    </form>

    <!-- PATCH -->
    <form id="update-user-form">
      <input type="number" id="update-id" placeholder="ID" required>
      <input type="text" id="update-name" placeholder="Новое имя" required>
      <button type="submit" class="button button-primary">PATCH обновить</button>
    </form>

    <!-- DELETE -->
    <form id="delete-user-form">
      <input type="number" id="delete-id" placeholder="ID" required>
      <button type="submit" class="button button-danger">DELETE</button>
    </form>

  </div>
  <div id="users-result" class="result-box">Результат операций появится здесь.</div>
</section>

  <section id="ipify" class="panel">
    <h2>ipify</h2>
    <button id="load-ip" class="button button-primary">Показать IP</button>
    <div id="ip-state" class="state-box">IP ещё не получен.</div>
    <div id="ip-result" class="result-box"></div>
  </section>
  

</main>
</body>
</html>
